spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/habittracker}
spring.datasource.username=${DB_USERNAME:habittracker}
spring.datasource.password=${DB_PASSWORD:habittracker}

# Use 'validate' in production and manage schema changes deliberately.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# No default on purpose: a committed signing key would let anyone forge a token for any
# account. Unset means a random key is generated per run (development only).
# Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8082}

# Don't hand internal detail to clients on an error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Respect X-Forwarded-* so HTTPS is detected correctly behind a load balancer.
server.forward-headers-strategy=framework
